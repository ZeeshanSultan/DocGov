version: 1
project:
  name: docgov
  mode: open-source
  visibility: mixed
  layout: compact
documentation:
  root: docs
  # GitHub renders YAML frontmatter in Markdown as a table, so the files it puts on the
  # project's front page are governed from here instead of from a block in the file.
  registrations:
    README.md:
      id: readme
      type: user.readme
      authority: audience
      visibility: public
      status: active
      owner: docgov
    CONTRIBUTING.md:
      id: contributing
      type: governance.contributing
      authority: audience
      visibility: public
      status: active
      owner: docgov
    SECURITY.md:
      id: security-public
      type: security.public-model
      authority: audience
      visibility: public
      status: active
      owner: docgov
    docs/README.md:
      id: docs-index
      type: docs.index
      authority: audience
      visibility: public
      status: active
      owner: docgov
    CODE_OF_CONDUCT.md:
      id: code-of-conduct
      type: governance.code-of-conduct
      authority: audience
      visibility: public
      status: active
      owner: docgov
    CHANGELOG.md:
      id: changelog
      type: release.changelog
      authority: historical
      visibility: public
      status: active
      owner: docgov
  exclude:
    - ".claude/**"
    - ".docgov/**"
    - "**/node_modules/**"
    - "**/SKILL.md"
    - "templates/**"
    - "lenses/**"
    - "policy/**"
governance:
  canonical_changes_require_review: false
  prevent_duplicate_domains: true
  allowed_root_docs:
    - README.md
    - CONTRIBUTING.md
    - SECURITY.md
    - CHANGELOG.md
    - CLAUDE.md
    - LICENSE.md
drift:
  enabled: true
generated:
  allow_manual_edit: false
domains:
  governance:
    paths:
      - "core/check.js"
      - "core/config.js"
      - "core/taxonomy.js"
    owner: docgov
  drift:
    paths:
      - "core/drift.js"
      - "core/impact.js"
    owner: docgov

