name: Documentation governance

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  docgov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # drift and impact analysis need history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Engine tests
        run: npm test

      # Exit 1 is a deterministic violation and fails the build.
      # Exit 2 is drift needing review: surfaced, not failed. Change that here if you
      # want drift to gate merges.
      - name: Deterministic checks
        run: |
          set +e
          ./bin/docgov check --all
          code=$?
          echo "docgov check exited $code"
          test "$code" -ne 1

      - name: Drift and impact
        if: github.event_name == 'pull_request'
        run: |
          ./bin/docgov drift --base "origin/${{ github.base_ref }}" || true
          ./bin/docgov manifest --pr --base "origin/${{ github.base_ref }}" > docgov-report.txt || true
          cat docgov-report.txt

      - name: Post the documentation review
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s docgov-report.txt ]; then
            gh pr comment "${{ github.event.number }}" \
              --body-file docgov-report.txt --edit-last --create-if-none
          fi
